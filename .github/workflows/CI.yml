name: CI

on:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.10"   # long term support
          - "1"      # latest stable
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        threads:
          - "1"
        include:
          # Exercise the threaded CPU backend on one configuration.
          - version: "1"
            os: ubuntu-latest
            threads: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: ${{ matrix.threads }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # The plotting extension is optional, so the matrix above never loads it — and
  # an untested optional path rots quietly. One job, one platform: enough to catch
  # a method overwrite, a renamed export or a broken figure call.
  #
  # GPU extensions cannot be covered this way (no GPU on a hosted runner); they
  # are exercised manually. This one can, so it is.
  makie-extension:
    name: Makie extension
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Test with CairoMakie loaded
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(; temp = true)
          Pkg.develop(PackageSpec(path = pwd()))
          Pkg.add(["CairoMakie", "Test", "Statistics"])
          Pkg.precompile()
          include(joinpath(pwd(), "test", "runtests.jl"))
